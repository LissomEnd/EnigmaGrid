name: Bug report
description: Report a reproducible problem with the volunteer client or public dashboard.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include device tokens, dashboard tokens, signing keys, private IP addresses, or personal files."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.4.1 (shown in the app or release name)"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Windows tray / Setup
        - Android app
        - Worker
        - Updater
        - Public dashboard
        - Coordinator
        - Solver
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Operating system and hardware
      description: Windows or Android version, CPU/GPU model, GPU driver version if known, and chosen CPU/GPU percentages. Do not include your device name or serial number.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, private addresses and personal data from this report.
          required: true
