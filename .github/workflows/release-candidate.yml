name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Build source worker bundle
        shell: pwsh
        run: |
          ./scripts/Build-WorkerBundle.ps1
          Copy-Item dist/enigma-volunteer-dev.zip dist/enigma-volunteer-windows.zip
      - name: Attest release candidate
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/enigma-volunteer-windows.zip
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: enigma-volunteer-windows
          path: dist/enigma-volunteer-windows.zip
          if-no-files-found: error
