name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone Windows candidate
        shell: pwsh
        run: |
          ./scripts/Build-WindowsStandalone.ps1
          Copy-Item dist/enigma-volunteer-windows-candidate.zip dist/enigma-volunteer-windows.zip
      - name: Test frozen worker and tray
        run: python tests/test_frozen_candidate.py
      - name: Test installer lifecycle
        run: python tests/test_installer_local.py
      - name: Attest worker update package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/enigma-volunteer-windows.zip
      - name: Attest Windows setup
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/EnigmaGridSetup.exe
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enigma-volunteer-windows
          path: |
            dist/enigma-volunteer-windows.zip
            dist/EnigmaGridSetup.exe
          if-no-files-found: error
