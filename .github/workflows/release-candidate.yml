name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Vulkan build SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: '1.4.309.0'
          cache: false
      - name: Build bounded GPU solver and shader
        shell: pwsh
        run: |
          cmake -S worker/native -B build/native -A x64 -DCMAKE_INSTALL_PREFIX="$PWD/worker/native/build/install"
          if ($LASTEXITCODE -ne 0) { throw 'Native solver configuration failed' }
          cmake --build build/native --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native solver build failed' }
          cmake --install build/native --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native solver installation failed' }
      - name: Build standalone Windows candidate
        shell: pwsh
        run: |
          ./scripts/Build-WindowsStandalone.ps1
          Copy-Item dist/enigma-volunteer-windows-candidate.zip dist/enigma-volunteer-windows.zip
      # The full HTTP/consensus test uses private coordinator policy modules,
      # which are deliberately not shipped in this public source repository.
      # This job can attest a candidate client package, NOT certify a production release.
      - name: Test frozen worker and tray (offline public smoke)
        run: python tests/test_frozen_candidate_smoke.py
      - name: Test installer lifecycle
        run: python tests/test_installer_local.py
      - name: Attest worker update package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/enigma-volunteer-windows.zip
      - name: Attest Windows setup
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/EnigmaGridSetup.exe
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enigma-volunteer-windows
          path: |
            dist/enigma-volunteer-windows.zip
            dist/EnigmaGridSetup.exe
          if-no-files-found: error
