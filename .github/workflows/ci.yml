name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Vulkan headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvulkan-dev
      - name: Native memory synchronization and failure cleanup
        run: |
          c++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer android/native-tests/host_memory_checks.cpp -o /tmp/enigmagrid-host-memory-checks
          /tmp/enigmagrid-host-memory-checks
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile server/coordinator.py server/validator.py worker/worker.py worker/updater.py worker/updater_apply.py worker/tray_app.py worker/installer.py scripts/create_update_manifest.py scripts/create_installer_payload.py scripts/sign_update_manifest_dpapi.py
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Dashboard privacy and asynchronous controls
        run: node tests/test_dashboard_controls.cjs
      - name: Consensus tests
        run: python tests/test_consensus_v2.py
      - name: Scientific pause preserves accounting
        run: python tests/test_campaign_pause.py
      - name: Bounded crib recovery and uncertainty
        run: python tests/test_bounded_crib.py
      - name: Exhaustive small-domain crib oracle
        run: python tests/test_crib_exhaustive.py
      - name: Historical bounded recovery
        run: python tests/test_historical_recovery.py
      - name: Historical indicator provenance
        run: python tests/test_indicator_replay.py
      - name: Offline research proposal gates
        run: python tests/test_research_plan.py
      - name: Experimental search receipts
        run: python tests/test_standard_receipts.py
      - name: Crib window stepping equivalence
        run: python tests/test_crib_window.py
      - name: Long research program scope
        run: python tests/test_research_program.py
      - name: Research program checkpoint integrity
        run: python tests/test_research_resume.py
      - name: Research work bounds and cancellation
        run: python tests/test_research_job_bounds.py
      - name: Offline research client controls
        run: python tests/test_research_client.py
      - name: Experimental receipt recomputation
        run: python tests/test_research_validation.py
      - name: Isolated research server validation
        run: python tests/test_research_server.py
      - name: Prior crib scope comparison
        run: python tests/test_crib_overlap.py
      - name: Quarantine tests
        run: python tests/test_quarantine_v2.py
      - name: Security tests
        run: python tests/test_security_v3.py
      - name: Native input bounds
        run: python tests/test_validator_bounds.py
      - name: Coordinator transport safety
        run: python tests/test_worker_transport.py
      - name: Constrained process parity and lifecycle
        run: python tests/test_crib_parallel.py
      - name: Constrained client process controls
        run: python tests/test_worker_constrained_parallel.py
      - name: Memory-aware workers and hidden update helpers
        run: python tests/test_worker_memory_and_hidden_updates.py
      - name: Windows console-free spawn context
        run: python tests/test_windows_hidden_spawn.py
      - name: Combined lease control snapshot
        run: python tests/test_worker_lease_snapshot.py
      - name: Windows bounded lease batches
        run: python tests/test_worker_batch_requests.py
      - name: Durable completion recovery
        run: python tests/test_pending_completion.py
      - name: Lease renewal during completion upload
        run: python tests/test_upload_renewal.py
      - name: Safe uninstall paths
        run: python tests/test_cleanup_safety.py
      - name: Shared proxy rate limits
        run: python tests/test_rate_limits.py
      - name: HTTP integration test
        run: python tests/test_http_integration_v3.py
      - name: Public surface test
        run: python tests/test_public_surface_v3.py
      - name: Portable search determinism
        run: python tests/test_portable_search.py
      - name: Worker resource and pause controls
        run: python tests/test_worker_controls.py
      - name: Client summary hardware provenance
        run: python tests/test_client_summary.py
      - name: Slow GPU duty budget and responsive rest
        run: python tests/test_gpu_duty.py
      - name: Windows state file lock recovery
        run: python tests/test_state_file_locks.py
      - name: Update signature and mandatory policy
        run: python tests/test_update_integrity.py
      - name: Conservative update package retention
        run: python tests/test_update_package_retention.py
      - name: Update feedback and manual retry
        run: python tests/test_update_feedback.py
      - name: Android lifecycle, update and network regressions
        shell: pwsh
        run: |
          $jdk = $env:JAVA_HOME_17_X64
          if (-not $jdk) { throw 'Java 17 is required for Android host checks' }
          python android/core/qualify_resume.py --jdk "$jdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android/core/qualify_resource_guard.py --jdk "$jdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android/core/qualify_updates.py --jdk "$jdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android/core/qualify_accelerator.py --jdk "$jdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android/core/qualify_native_unavailable.py --jdk "$jdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_constrained_telemetry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android/core/qualify_network_cycle.py --jdk "$jdk"
          exit $LASTEXITCODE
