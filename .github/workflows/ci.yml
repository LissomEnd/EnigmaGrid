name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile server/coordinator.py server/validator.py worker/worker.py worker/updater.py worker/updater_apply.py scripts/create_update_manifest.py scripts/sign_update_manifest_dpapi.py
      - name: Consensus tests
        run: python tests/test_consensus_v2.py
      - name: Quarantine tests
        run: python tests/test_quarantine_v2.py
      - name: Security tests
        run: python tests/test_security_v3.py
      - name: HTTP integration test
        run: python tests/test_http_integration_v3.py
