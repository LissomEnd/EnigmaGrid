name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile server/coordinator.py server/validator.py worker/worker.py worker/updater.py worker/updater_apply.py
      - name: Consensus tests
        run: python tests/test_consensus_v2.py
      - name: Quarantine tests
        run: python tests/test_quarantine_v2.py
      - name: Security tests
        run: python tests/test_security_v3.py
