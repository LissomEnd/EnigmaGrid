name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile server/coordinator.py server/validator.py worker/worker.py worker/updater.py worker/updater_apply.py worker/tray_app.py worker/installer.py scripts/create_update_manifest.py scripts/create_installer_payload.py scripts/sign_update_manifest_dpapi.py
      - name: Check dashboard JavaScript
        run: node --check web/app.js
      - name: Consensus tests
        run: python tests/test_consensus_v2.py
      - name: Quarantine tests
        run: python tests/test_quarantine_v2.py
      - name: Security tests
        run: python tests/test_security_v3.py
      - name: Native input bounds
        run: python tests/test_validator_bounds.py
      - name: Coordinator transport safety
        run: python tests/test_worker_transport.py
      - name: Safe uninstall paths
        run: python tests/test_cleanup_safety.py
      - name: Shared proxy rate limits
        run: python tests/test_rate_limits.py
      - name: HTTP integration test
        run: python tests/test_http_integration_v3.py
      - name: Public surface test
        run: python tests/test_public_surface_v3.py
      - name: Portable search determinism
        run: python tests/test_portable_search.py
      - name: Worker resource and pause controls
        run: python tests/test_worker_controls.py
